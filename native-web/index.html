<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Aite</title>
    <style>
      body {
        margin: 0;
        background: #080b12;
        color: #fff;
        font-family: system-ui;
        display: grid;
        min-height: 100vh;
        place-items: center;
        text-align: center;
      }
      main {
        max-width: 320px;
        padding: 28px;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 24px;
        background: #fff;
        display: grid;
        place-items: center;
        margin: auto auto 18px;
        overflow: hidden;
      }
      .mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #101828;
        padding: 12px 22px;
        font-weight: 700;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="logo.png" alt="Aite" /></div>
      <h1>لا يوجد اتصال</h1>
      <p>تحقق من اتصال الإنترنت ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
