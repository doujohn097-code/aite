<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Aite - لا يوجد اتصال</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "IBM Plex Sans Arabic", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    /* Brand row - مطابق لشاشة البداية */
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      direction: ltr;
    }
    .icon-mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      flex-shrink: 0;
    }
    .icon-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .divider {
      width: 1px;
      height: 64px;
      background: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .brand-name {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1;
      color: #fff;
    }
    .brand-from {
      font-size: 14px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      line-height: 1;
    }
    .separator {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.12);
      margin: 36px 0;
    }
    .offline-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 18px;
      filter: drop-shadow(0 4px 12px rgba(255,255,255,0.15));
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: #fff;
    }
    .desc {
      font-size: 15px;
      line-height: 1.6;
      color: #b4becd;
      margin: 0;
      white-space: pre-line;
    }
    .retry-btn {
      margin-top: 28px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #080b12;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 24px rgba(255,255,255,0.15);
      -webkit-tap-highlight-color: transparent;
    }
    .retry-btn:active {
      transform: scale(0.96);
    }
    .retry-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #4ade80;
      min-height: 18px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .checking {
      animation: pulse 1.2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- شعار مطابق لشاشة البداية -->
    <div class="brand-row">
      <div class="icon-mark">
        <img src="logo.png" alt="Aite" onerror="this.style.display='none'" />
      </div>
      <div class="divider"></div>
      <div class="brand-text">
        <div class="brand-name">Aite</div>
        <div class="brand-from">from salem ahmed</div>
      </div>
    </div>

    <div class="separator"></div>

    <div class="offline-icon">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.48L10.24 5.9c.58-.06 1.16-.1 1.76-.1 5.07 0 8.77 2.35 10.14 3.38L23.64 7zM17.04 15.22c.92-.38 1.77-.87 2.42-1.36L12 7.68v3.1c1.85.06 3.62.61 5.04 1.44v3zM3.53 2.75 2.28 4.03l2.35 2.35C2.5 7.33 1.06 8.34.36 8.87L2.5 11c.86-.65 2.6-1.83 4.84-2.52l2.24 2.24c-1.68.34-3.16 1.07-4.08 1.75L7.64 14.6c.94-.7 2.55-1.5 4.36-1.6v.05l7.42 7.42 1.27-1.27L3.53 2.75zM12 21.5l3.5-4.36c-.94-.7-2.16-1.14-3.5-1.14s-2.56.44-3.5 1.14L12 21.5z" fill="#fff"/>
      </svg>
    </div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p class="desc">أنت غير متصل حالياً
تحقق من اتصالك بالإنترنت وحاول مجدداً للوصول إلى Aite</p>

    <button class="retry-btn" id="retryBtn" onclick="attemptReload()">إعادة المحاولة</button>
    <div class="hint">سيتم إعادة الاتصال تلقائياً عند عودة الإنترنت</div>
    <div class="status" id="status"></div>
  </div>

  <script>
    (function() {
      const SERVER_URL = 'https://aite-app-one.vercel.app/';
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('retryBtn');
      let isChecking = false;

      function setStatus(msg, isChecking) {
        statusEl.textContent = msg || '';
        statusEl.className = 'status' + (isChecking ? ' checking' : '');
      }

      function hasNetwork() {
        return navigator.onLine;
      }

      // منع صفحة المتصفح الافتراضية - هذه الصفحة نفسها هي صفحة عدم الاتصال
      // حتى لو فشل تحميل SERVER_URL، نبقى في هذه الصفحة المخصصة

      function attemptReload() {
        if (isChecking) return;
        isChecking = true;
        btn.disabled = true;
        btn.textContent = 'جاري التحقق...';
        setStatus('يتم التحقق من الاتصال...', true);

        // محاولة تحميل صفحة صغيرة للتحقق من الإنترنت
        fetch(SERVER_URL, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
          .then(() => {
            setStatus('تم الاتصال! جاري العودة...', false);
            // إعادة تحميل التطبيق الأصلي
            setTimeout(() => {
              // محاولة العودة للتطبيق الأصلي
              window.location.href = SERVER_URL;
              // كاحتياطي، إعادة تحميل الصفحة الحالية التي ستوجهها MainActivity
              setTimeout(() => location.reload(), 800);
            }, 500);
          })
          .catch(() => {
            // حتى لو فشل fetch بسبب CORS، نتحقق من navigator.onLine
            if (hasNetwork()) {
              setStatus('تم الاتصال! جاري العودة...', false);
              setTimeout(() => {
                window.location.href = SERVER_URL;
                setTimeout(() => location.reload(), 800);
              }, 500);
            } else {
              isChecking = false;
              btn.disabled = false;
              btn.textContent = 'إعادة المحاولة';
              setStatus('لا يزال الاتصال غير متوفر', false);
              // اهتزاز بصري
              document.body.animate([
                { transform: 'translateX(0)' },
                { transform: 'translateX(6px)' },
                { transform: 'translateX(-6px)' },
                { transform: 'translateX(0)' }
              ], { duration: 300, easing: 'ease-out' });
            }
          });
      }

      // مراقبة عودة الإنترنت تلقائياً
      window.addEventListener('online', () => {
        setStatus('تم استعادة الاتصال! جاري العودة...', true);
        setTimeout(attemptReload, 800);
      });

      window.addEventListener('offline', () => {
        setStatus('انقطع الاتصال', false);
      });

      // محاولة تلقائية كل 3 ثوانٍ إذا كان هناك إنترنت
      setInterval(() => {
        if (hasNetwork() && !isChecking) {
          attemptReload();
        }
      }, 3000);

      // عند التحميل، إذا كان هناك إنترنت بالفعل، حاول العودة فوراً
      if (hasNetwork()) {
        setStatus('تم اكتشاف اتصال، جاري التحقق...', true);
        setTimeout(attemptReload, 1000);
      }

      // منع ظهور قائمة السياق الافتراضية
      document.addEventListener('contextmenu', e => e.preventDefault());
    })();
  </script>
</body>
</html>
