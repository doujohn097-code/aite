name: Dump Secret Check
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret exists
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ]; then
            echo "SA empty"
          else
            echo "SA length ${#SA}"
            echo "$SA" | head -c 100
          fi
          echo "PROJECT_ID=$PROJECT_ID"
          # Create base64 for admin key
          echo "$SA" | base64 -w0 > /tmp/b64.txt
          echo "B64 length $(wc -c < /tmp/b64.txt)"
          echo "First 100 chars of b64:"
          head -c 100 /tmp/b64.txt
          echo ""
