apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.aite.app"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.aite.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            // مفتاح الرفع محفوظ في android/keystore (مستودع خاص) — انظر
            // keystore.properties. متغيرات البيئة AITE_UPLOAD_* تلغي القيم.
            def keystoreProps = new Properties()
            def propsFile = rootProject.file("keystore/keystore.properties")
            if (propsFile.exists()) {
                propsFile.withInputStream { keystoreProps.load(it) }
            }
            def keystorePath = System.getenv("AITE_UPLOAD_KEYSTORE") ?: keystoreProps.getProperty("storeFile")
            if (keystorePath) {
                storeFile rootProject.file(keystorePath)
                storePassword System.getenv("AITE_UPLOAD_STORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
                keyAlias System.getenv("AITE_UPLOAD_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
                keyPassword System.getenv("AITE_UPLOAD_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
